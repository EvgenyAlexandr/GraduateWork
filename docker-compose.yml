services:
  postgres:
    image: postgres:15-alpine
    container_name: ads-postgres
    restart: always
    environment:
      POSTGRES_DB: ads
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ads-postgres-data:/var/lib/postgresql/data

volumes:
  ads-postgres-data:
